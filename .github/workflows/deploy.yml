name: Deploy Prototype to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/ml-nlp
  workflow_dispatch:

# Grant GITHUB_TOKEN required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploys prototype directory directly as the website root
          path: './prototype'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
